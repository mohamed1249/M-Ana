site_name: M-Ana
site_description: Practical helpers for repeatable data-science workflows
repo_url: https://github.com/mohamed1249/M-Ana
repo_name: mohamed1249/M-Ana

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - API: api.md
  - Tutorials:
      - Data module notebook: tutorials/data.md
      - Modeling module notebook: tutorials/modeling.md
      - Analysis module notebook: tutorials/analysis.md
      - Statistics module notebook: tutorials/statistics.md
      - Time series module notebook: tutorials/time_series.md
      - Database and PostgreSQL: tutorials/database.md
      - NLP module notebook: tutorials/nlp.md
      - RAG: tutorials/rag.md
      - Recommenders: tutorials/recommenders.md
  - Versioning: versioning.md
  - MAna 2.0.0 announcement kit: releases/2.0.0-linkedin-kit.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
